name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-checks:
    name: Ubuntu checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:tsc
      - run: bun run test
      - run: bun run build:sdk
      - run: bun run build:vscode
      - run: bun run react-doctor

  macos-ui:
    name: macOS build and UI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The sct run CLI step opens its own unlock window that the test does not drive.
      - run: cd tests && bunx playwright test --config ../playwright.config.ts --grep-invert "manages secrets per project without rendering stored values"

  linux-ui:
    name: Linux UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: bun install --frozen-lockfile
      - run: bun run build
      # On Linux, the sct run CLI step opens its own unlock window that the test does not drive.
      - run: xvfb-run -a bash -lc 'cd tests && bunx playwright test --config ../playwright.config.ts --grep-invert "manages secrets per project without rendering stored values"'

  portable:
    name: ${{ matrix.os }} portable checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint and type check
        run: bun run check
      - name: TypeScript compiler
        run: bun run typecheck:tsc
      - name: Storage tests
        run: bun run test
      - name: Application build
        run: bun run build
      - name: Windows UI smoke test
        working-directory: tests
        run: bunx playwright test platform.spec.ts --config ../playwright.config.ts

  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: bun run package:win
          - os: ubuntu-latest
            command: bun run package:linux
          - os: macos-latest
            command: bun run package:mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
        if: runner.os == 'Linux'
      - run: bun install --frozen-lockfile
      - name: Package
        run: ${{ matrix.command }}
        env:
          SCT_SIGN: adhoc
      - name: Set Linux sandbox permissions
        if: runner.os == 'Linux'
        run: sudo chown root:root dist/global.sct-linux-x64/chrome-sandbox && sudo chmod 4755 dist/global.sct-linux-x64/chrome-sandbox
      - name: Check packaged fuses
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            executable=dist/global.sct-linux-x64/sct
          else
            executable=dist/global.sct-darwin-arm64/global.sct.app/Contents/MacOS/sct
          fi
          node --input-type=commonjs <<'NODE'
          const { spawn } = require('node:child_process')

          function runLimited(command, args, env, timeoutMs) {
            return new Promise((resolve, reject) => {
              const child = spawn(command, args, {
                detached: true,
                env: { ...process.env, ...env },
                stdio: 'ignore'
              })
              let timedOut = false
              let killTimer
              const timeout = setTimeout(() => {
                if (child.exitCode === null && child.signalCode === null) {
                  timedOut = true
                  try {
                    process.kill(-child.pid, 'SIGTERM')
                  } catch (error) {
                    reject(error)
                  }
                  killTimer = setTimeout(() => {
                    try {
                      process.kill(-child.pid, 'SIGKILL')
                    } catch {}
                  }, 1000)
                }
              }, timeoutMs)
              child.once('error', (error) => {
                clearTimeout(timeout)
                reject(error)
              })
              child.once('close', (code, signal) => {
                clearTimeout(timeout)
                clearTimeout(killTimer)
                resolve({ code, signal, timedOut })
              })
            })
          }

          async function checkExit(label, command, args, env, expectedCode) {
            const result = await runLimited(command, args, env, 20000)
            if (result.timedOut || result.code !== expectedCode) {
              throw new Error(`${label}: expected exit ${expectedCode} before timeout; got ${result.timedOut ? 'timeout' : result.code ?? result.signal}.`)
            }
          }

          async function main() {
            const executable = process.env.RUNNER_OS === 'Linux'
              ? 'dist/global.sct-linux-x64/sct'
              : 'dist/global.sct-darwin-arm64/global.sct.app/Contents/MacOS/sct'

            if (process.env.RUNNER_OS === 'Linux') {
              const app = await runLimited('xvfb-run', ['-a', 'env', 'ELECTRON_RUN_AS_NODE=1', 'dist/global.sct-linux-x64/sct', '-e', 'process.exit(7)'], {}, 20000)
              if (!app.timedOut) throw new Error(`RunAsNode check: expected the app to run until timeout; it exited with ${app.code ?? app.signal}.`)
              await checkExit('_demo without token', 'xvfb-run', ['-a', 'dist/global.sct-linux-x64/sct', '_demo'], {}, 1)
              await checkExit('_demo with token', 'xvfb-run', ['-a', 'env', 'SCT_DEMO_TOKEN=synthetic-value', 'dist/global.sct-linux-x64/sct', '_demo'], {}, 0)
            } else {
              const app = await runLimited(executable, ['-e', 'process.exit(7)'], { ELECTRON_RUN_AS_NODE: '1' }, 20000)
              if (!app.timedOut) throw new Error(`RunAsNode check: expected the app to run until timeout; it exited with ${app.code ?? app.signal}.`)
              await checkExit('_demo without token', executable, ['_demo'], {}, 1)
              await checkExit('_demo with token', executable, ['_demo'], { SCT_DEMO_TOKEN: 'synthetic-value' }, 0)
            }
          }

          main().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - name: Check packaged fuses on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'dist/global.sct-win32-x64/sct.exe').Path
          $node = Start-Process -FilePath $executable -ArgumentList @('-e', 'process.exit(7)') -Environment @{ ELECTRON_RUN_AS_NODE = '1' } -PassThru
          if ($node.WaitForExit(20000)) { throw "RunAsNode executable exited before timeout with code $($node.ExitCode)." }
          Stop-Process -Id $node.Id -Force
          if (-not $node.WaitForExit(5000)) { throw 'RunAsNode process did not stop after the timeout.' }

          function Invoke-Limited {
            param([string[]]$Arguments, [hashtable]$Environment, [string]$Label, [int]$ExpectedExitCode)
            $process = Start-Process -FilePath $executable -ArgumentList $Arguments -Environment $Environment -PassThru
            if (-not $process.WaitForExit(20000)) {
              Stop-Process -Id $process.Id -Force
              if (-not $process.WaitForExit(5000)) { throw "$Label did not stop after the timeout." }
              throw "$Label timed out."
            }
            if ($process.ExitCode -ne $ExpectedExitCode) {
              throw "${Label}: expected exit $ExpectedExitCode; got $($process.ExitCode)."
            }
          }

          Invoke-Limited -Arguments @('_demo') -Environment @{} -Label '_demo without token' -ExpectedExitCode 1
          Invoke-Limited -Arguments @('_demo') -Environment @{ SCT_DEMO_TOKEN = 'synthetic-value' } -Label '_demo with token' -ExpectedExitCode 0
